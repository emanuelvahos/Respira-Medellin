name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecodata-lab-frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: ecodata-lab-frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Rutas obligatorias de Settings (sin default); mismas que .env.example
      DATA_INTEGRACION_PM25_ARBOLES: ./data/integracion_v2_pm25_arboles_medellin.csv
      DATA_AUDITORIA_ESTACIONES_COMUNAS: ./data/auditoria_estaciones_comunas.csv
      DATA_RELACIONES_BLOQUE2: ./data/relaciones_v2_bloque2.csv
      DATA_RECOMENDACION_SIEMBRA_ZONA: ./data/recomendacion_siembra_por_zona.csv
      DATA_RESUMEN_RECOMENDACION_COMUNA: ./data/resumen_recomendacion_por_comuna.csv
      DATA_ZONAS_PRIORIZADAS_SIEMBRA: ./data/zonas_priorizadas_siembra.geojson
      DATA_LIMITE_CATASTRAL_COMUNAS: ./data/limite_catastral_de_comun.geojson
      DATA_INVENTARIO_ZONAS_VERDES: ./data/inventario_zonas_verdes.geojson
      DATA_SOLICITUD_PM25_ESTACIONES: ./data/Solicitud_PM25_DP1763941.csv
      DATA_SAU_ARBOLES_URBANOS: ./data/sau_arboles_urbanos.csv
      DATA_SALUD_RESPIRATORIA_RESUMEN_COMUNA: ./data/salud_respiratoria_resumen_comuna.json
      DATA_POBLACION_POR_COMUNA: ./data/poblacion_por_comuna.csv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test
        run: pytest
