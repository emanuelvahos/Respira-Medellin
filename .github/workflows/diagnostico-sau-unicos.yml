name: Diagnóstico SAU únicos (temporal, H1)
on:
  push:
    branches: [diag-sau2]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
      - run: pip install requests
      - run: python backend/scripts/diagnosticar_sau_unicos.py
      - name: Publicar resultado
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -b diag-sau2-resultado
          git add -f backend/data/diagnostico_sau_unicos.json
          git commit -m "diagnóstico SAU únicos (resultado)" || exit 0
          git push -f origin diag-sau2-resultado
