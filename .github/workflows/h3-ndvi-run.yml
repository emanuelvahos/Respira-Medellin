name: h3-ndvi-run
on:
  push:
    branches: [h3-ndvi-run]
jobs:
  ndvi:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install geopandas pandas numpy rasterio pystac-client planetary-computer odc-stac xarray dask pyproj
      - run: cd backend && python scripts/calcular_ndvi_comunas.py 2>&1 | tail -60
      - name: Publicar resultado
        run: |
          git config user.name bot; git config user.email bot@example.com
          git checkout -b h3-ndvi-result
          git add backend/data/ndvi_por_comuna.csv backend/data/ndvi_meta.json
          git commit -m "resultado ndvi"
          git push -f origin h3-ndvi-result
