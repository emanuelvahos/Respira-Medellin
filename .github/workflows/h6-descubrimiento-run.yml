name: h6-descubrimiento-run
on:
  push:
    branches: [h6-descubrimiento-run]
jobs:
  descubrir:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - run: python backend/scripts/sondear_valores_terreno.py out > out_log.txt 2>&1; mkdir -p out; tail -60 out_log.txt; cp out_log.txt out/log.txt
        continue-on-error: true
      - name: Texto del Plan de Silvicultura
        continue-on-error: true
        run: |
          pip install pypdf >/dev/null
          python - <<'PY'
          import pathlib
          from pypdf import PdfReader
          p = pathlib.Path("out/plan_silvicultura.pdf")
          if p.exists():
              t = "\n\n".join((pg.extract_text() or "") + f"\n[pagina {i+1}]" for i, pg in enumerate(PdfReader(str(p)).pages))
              pathlib.Path("out/plan_silvicultura.txt").write_text(t)
              p.unlink()
              print(len(t))
          PY
      - name: Publicar resultado
        if: always()
        run: |
          git config user.name bot; git config user.email bot@example.com
          git checkout -b h6-descubrimiento-result
          git add -f out
          git commit -m "resultado descubrimiento"
          git push -f origin h6-descubrimiento-result
