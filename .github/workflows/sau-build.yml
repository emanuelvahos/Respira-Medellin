name: SAU build (temporal, H1)
on:
  push:
    branches: [h1-sau-estado]
    paths: [backend/scripts/fetch_sau_arboles.py, .github/workflows/sau-build.yml]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
      - run: pip install requests
      - run: python backend/scripts/fetch_sau_arboles.py --comparar-contrato
      - name: Publicar datos
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -b h1-sau-datos
          git add -f backend/data/sau_arboles_urbanos.csv backend/data/sau_arboles_balance.json backend/data/sau_comparacion_capas.json
          git commit -m "datos SAU (build)" || exit 0
          git push -f origin h1-sau-datos
