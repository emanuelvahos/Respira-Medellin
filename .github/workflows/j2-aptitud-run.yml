name: j2-aptitud-run
on:
  push:
    branches: [j2-aptitud-run]
jobs:
  calcular:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt tifffile
      - name: Calcular aptitud
        continue-on-error: true
        run: cd backend && python scripts/calcular_aptitud_terreno.py --salida data > ../log.txt 2>&1; tail -40 ../log.txt
      - name: Publicar resultado
        if: always()
        run: |
          git config user.name "actions"; git config user.email "actions@users.noreply.github.com"
          mkdir -p out && cp log.txt out/ || true
          cp backend/data/aptitud_terreno_por_zona.csv backend/data/puntos_indicativos_siembra.geojson backend/data/capas_terreno_manifest.json out/ 2>/dev/null || true
          git checkout -b j2-aptitud-result
          git add -f out
          git commit -m "resultado j2" || true
          git push -f origin j2-aptitud-result
